<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D 3D Live & Calendar</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pyidaungsu', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            color: #333;
            padding: 15px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
        }
        h2 {
            color: #1a73e8;
            margin-bottom: 15px;
            font-size: 20px;
        }
        /* 2D Live Display */
        .live-number {
            font-size: 64px;
            font-weight: bold;
            color: #d93025;
            margin: 10px 0;
        }
        .live-details {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
        }
        .live-details div {
            font-size: 14px;
        }
        .live-details span {
            display: block;
            font-weight: bold;
            color: #1e8e3e;
            font-size: 16px;
        }
        .update-time {
            font-size: 12px;
            color: #70757a;
            margin-top: 8px;
        }

        /* Calendar Section */
        .calendar-section input[type="date"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            font-size: 16px;
            margin-top: 10px;
            outline: none;
        }
        .history-result {
            margin-top: 15px;
            padding: 10px;
            background: #e8f0fe;
            border-radius: 8px;
            color: #1967d2;
            font-weight: bold;
        }

        /* Customer Support Section */
        .support-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 16px;
            transition: opacity 0.2s;
        }
        .support-btn:hover {
            opacity: 0.9;
        }
        .viber-btn {
            background-color: #7360f2;
        }
        .telegram-btn {
            background-color: #0088cc;
        }
        .phone-btn {
            background-color: #34a853;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- 2D Real-time Live Section -->
    <div class="card">
        <h2>2D Real-Time Live</h2>
        <div class="live-number" id="live2d">--</div>
        <div class="live-details">
            <div>SET Index <span id="setIndex">--</span></div>
            <div>Value <span id="setValue">--</span></div>
        </div>
        <div class="update-time" id="updateTime">နောက်ဆုံးပြင်ဆင်ချိန် - --:--:--</div>
    </div>

    <!-- Calendar Section (ပြက္ခဒိန်) -->
    <div class="card calendar-section">
        <h2>2D/3D ထွက်ဂဏန်း ပြက္ခဒိန်</h2>
        <p style="font-size: 14px; color: #5f6368;">ရက်စွဲရွေးပြီး အဟောင်းများ ကြည့်ရန် -</p>
        <input type="date" id="calendarPicker" onchange="checkHistoryDate(this.value)">
        <div class="history-result" id="historyOutput">
            ရက်စွဲတစ်ခု ရွေးချယ်ပါ
        </div>
    </div>

    <!-- Customer Support Section -->
    <div class="card">
        <h2>Customer Support (ဆက်သွယ်ရန်)</h2>
        
        <!-- Viber Link -->
        <a href="viber://chat?number=%2B959481765" class="support-btn viber-btn" target="_blank">
            💬 Viber မှ ဆက်သွယ်ရန်
        </a>

        <!-- Telegram Link -->
        <a href="https://t.me/+9594081765" class="support-btn telegram-btn" target="_blank">
            ✈️ Telegram မှ ဆက်သွယ်ရန်
        </a>

        <!-- Phone Call Link -->
        <a href="tel:09400081765" class="support-btn phone-btn">
            📞 ဖုန်းခေါ်ဆိုရန်: 09400081765
        </a>
    </div>

</div>

<script>
    // ယနေ့ရက်စွဲကို Calendar တွင် Default ထည့်ထားခြင်း
    document.getElementById('calendarPicker').valueAsDate = new Date();

    // Thai SET API မှ 2D Real-time Live ဆွဲယူခြင်း
    async function fetchLive2D() {
        try {
            const response = await fetch('https://live-2d-api.kyaung.workers.dev/api/live');
            const data = await response.json();

            document.getElementById('live2d').innerText = data.live || '--';
            document.getElementById('setIndex').innerText = data.set || '--';
            document.getElementById('setValue').innerText = data.val || '--';
            document.getElementById('updateTime').innerText = 'နောက်ဆုံးပြင်ဆင်ချိန် - ' + (data.time || '');
        } catch (error) {
            console.error('Error fetching live data:', error);
        }
    }

    // ၃ စက္ကန့်တိုင်း Real-time Auto Refresh လုပ်ရန်
    setInterval(fetchLive2D, 3000);
    fetchLive2D(); // Initial Call

    // ပြက္ခဒိန် ရက်စွဲရွေးလိုက်လျှင် အလုပ်လုပ်မည့် Function
    function checkHistoryDate(selectedDate) {
        if (!selectedDate) return;
        
        // ရက်စွဲအလိုက် ထွက်ဂဏန်းပြသပေးမည့် နမူနာ (လိုအပ်ပါက Database/API ထည့်သွင်းနိုင်ပါသည်)
        document.getElementById('historyOutput').innerText = selectedDate + ' နေ့အတွက် ထွက်ဂဏန်း စာရင်းများကို ရယူနေပါသည်...';
    }
</script>

</body>
</html>
